name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check version
        shell: bash
        run: python scripts/release.py check-tag "$RELEASE_TAG"
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --component rustfmt --target "$TARGET"
      - run: cargo +stable fmt --check
      - name: Test
        shell: bash
        run: cargo +stable test --locked --target "$TARGET"
      - name: Build
        shell: bash
        run: cargo +stable build --release --locked --target "$TARGET"
      - name: Package
        shell: bash
        run: python scripts/release.py package "$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: target/release-assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: assets
      - name: Verify archives
        working-directory: assets
        run: |
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish release
        run: |
          gh release create "$RELEASE_TAG" assets/*.zip assets/*.tar.gz assets/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
