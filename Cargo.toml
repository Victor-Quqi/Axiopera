[package]
name = "axiopera"
version = "0.2.2"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Orchestrate coding agents (Claude Code, Codex, Grok Build) as sub-agents of each other"
repository = "https://github.com/Victor-Quqi/Axiopera"
readme = "README.md"
keywords = ["cli", "coding-agents", "claude", "codex", "grok"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README*.md", "/docs/**", "/plugins/axiopera/skills/axiopera/SKILL.md"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Paused time for tests of timers.
tokio = { version = "1.53", features = ["test-util"] }

[profile.release]
strip = true
